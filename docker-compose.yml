# Парсер ScienceDirect — один контейнер, работает постоянно.
# Вывод в /mnt/nfs_share/sd_parse (NFS). Задайте DOCKERHUB_USER в .env.
#
# Запуск контейнера (один раз, без выхода):
#   docker compose up -d
#
# Выполнение скрипта по команде:
#   docker compose exec parser run journals   — парсинг журналов
#   docker compose exec parser run articles   — парсинг статей
#   docker compose exec parser run issues     — парсинг выпусков
#   docker compose exec parser run download   — скачивание PDF
#   docker compose exec parser run help       — справка
# После перезагрузки сервера контейнер поднимется сам (restart: unless-stopped).

services:
  parser:
    build: .
    image: ${DOCKERHUB_USER}/sciencedirect-parser:latest
    environment:
      - SD_PARSE_OUTPUT=/mnt/nfs_share/sd_parse
    volumes:
      - /mnt/nfs_share:/mnt/nfs_share
    restart: unless-stopped
    command: [ "sleep", "infinity" ]
    # Ограничение ОЗУ: скрипт download (Chrome/Selenium) не должен съедать всю память хоста.
    # Если deploy не применится (старый docker-compose), добавьте на уровне сервиса: mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
